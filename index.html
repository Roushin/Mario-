<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mario Sprite Edition</title>
    <style>
        body { text-align: center; background: #000; color: white; font-family: Arial; margin: 0; overflow: hidden; touch-action: manipulation; }
        canvas { background: #5c94fc; display: block; margin: 0 auto; max-width: 100%; height: auto; border-bottom: 4px solid #fff; image-rendering: pixelated; }
        .ui-panel { padding: 10px; display: flex; justify-content: space-between; background: #333; font-weight: bold; }
        .controls-container { display: flex; justify-content: space-around; padding: 20px 10px; background: #222; user-select: none; }
        .btn { width: 65px; height: 65px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 4px solid #666; touch-action: none; }
        .btn:active { background: #888; }
        #jumpBtn { background: #2ecc71; }
        #fireBtn { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div>STAGE: <span id="stageNum">1</span></div>
        <div id="status">MARIO</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-container">
        <div style="display:flex; gap:15px;">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div style="display:flex; gap:15px;">
            <div class="btn" id="fireBtn">🔥</div>
            <div class="btn" id="jumpBtn">UP</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Assets
const marioSprite = new Image();
// Using a classic public domain style sprite sheet URL
marioSprite.src = 'https://i.imgur.com/6S79O89.png'; 

const goombaSprite = new Image();
goombaSprite.src = 'https://i.imgur.com/8Bv999Y.png';

// Game State
let stage = 1;
let frameCount = 0;
const gravity = 0.7;
const friction = 0.85;

const player = {
    x: 50, y: 300, width: 32, height: 32,
    velX: 0, velY: 0, speed: 5, jumpStrength: 12,
    grounded: false, facing: 'right', animFrame: 0,
    type: 'small' // small, big, fire
};

let platforms = [], enemies = [], powerups = [], bullets = [];
let pipe = { x: 2000, y: 320, w: 50, h: 60 };
const inputs = { left: false, right: false, up: false };

// Input Listeners
function setupTouchBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
}
setupTouchBtn('leftBtn', 'left');
setupTouchBtn('rightBtn', 'right');
setupTouchBtn('jumpBtn', 'up');
document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
    e.preventDefault(); if(player.type === 'fire') shoot();
});

function initLevel() {
    platforms = []; enemies = []; powerups = []; 
    platforms.push({ x: 0, y: 380, w: 3000, h: 20 }); // Ground

    for (let i = 0; i < 15; i++) {
        let rx = 300 + (i * 180);
        let ry = 220 + Math.random() * 80;
        platforms.push({ x: rx, y: ry, w: 90, h: 20 });
        if (Math.random() > 0.6) {
            powerups.push({ x: rx + 30, y: ry - 35, w: 25, h: 25, type: Math.random() > 0.5 ? 'mushroom' : 'flower' });
        }
        if (Math.random() > 0.4) {
            enemies.push({ x: rx + 10, y: ry - 30, w: 30, h: 30, velX: 1.5, type: 'goomba' });
        }
    }
    
    // Boss Every 3 stages
    if(stage % 3 === 0) {
        enemies.push({ x: 2200, y: 100, w: 80, h: 80, velX: 2, hp: 5, type: 'boss' });
        pipe.x = 2600;
    } else {
        pipe.x = 2200;
    }
    
    player.x = 50; player.y = 300;
    document.getElementById('stageNum').innerText = stage;
}

function shoot() {
    bullets.push({ x: player.x + 15, y: player.y + 10, w: 10, h: 10, velX: (player.facing === 'right' ? 8 : -8) });
}

function update() {
    // Movement Logic
    if (inputs.up && player.grounded) { player.velY = -player.jumpStrength; player.grounded = false; }
    if (inputs.right) { player.velX < player.speed && player.velX++; player.facing = 'right'; }
    if (inputs.left) { player.velX > -player.speed && player.velX--; player.facing = 'left'; }

    player.velY += gravity;
    player.x += player.velX;
    player.y += player.velY;
    player.velX *= friction;
    player.grounded = false;

    // Animation Ticker
    if(Math.abs(player.velX) > 0.2) {
        frameCount++;
        if(frameCount % 5 === 0) player.animFrame = (player.animFrame + 1) % 3;
    } else {
        player.animFrame = 0; // Idle
    }

    // Platform Collision
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.width > p.x &&
            player.y < p.y + p.h && player.y + player.height > p.y) {
            if (player.velY > 0) { player.grounded = true; player.velY = 0; player.y = p.y - player.height; }
        }
    });

    // Pipe / Next Level
    if (player.x > pipe.x && player.x < pipe.x + pipe.w && player.y > pipe.y - 20) {
        stage++; initLevel();
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-player.x + 150, 0);

    // Draw Pipe
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(pipe.x, pipe.y, pipe.w, pipe.h);

    // Draw Platforms (Bricks)
    ctx.fillStyle = "#ff9b3b";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    // Draw Powerups
    powerups.forEach(p => {
        ctx.fillStyle = p.type === 'mushroom' ? "red" : "white";
        ctx.beginPath(); ctx.arc(p.x+10, p.y+10, 10, 0, 7); ctx.fill();
    });

    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.type === 'boss' ? "purple" : "brown";
        ctx.fillRect(e.x, e.y, e.w, e.h);
        e.x += e.velX; if(e.x > 2800 || e.x < 0) e.velX *= -1;
    });

    // Draw Player Sprite
    drawPlayer();

    ctx.restore();
}

function drawPlayer() {
    ctx.save();
    let spriteX = player.animFrame * 16; // Assuming 16x16 frames in sheet
    let spriteY = 0;
    
    if (!player.grounded) spriteX = 32; // Jump frame
    
    if (player.facing === 'left') {
        ctx.scale(-1, 1);
        ctx.drawImage(marioSprite, spriteX, spriteY, 16, 16, -player.x - player.width, player.y, player.width, player.height);
    } else {
        ctx.drawImage(marioSprite, spriteX, spriteY, 16, 16, player.x, player.y, player.width, player.height);
    }
    ctx.restore();
}

marioSprite.onload = () => {
    initLevel();
    update();
};
</script>
</body>
</html>
