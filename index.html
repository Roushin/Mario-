<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Mario Clone</title>
    <style>
        body { 
            text-align: center; 
            background: #222; 
            color: white; 
            font-family: Arial; 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation;
        }
        canvas { 
            background: #5c94fc; 
            display: block; 
            margin: 0 auto; 
            max-width: 100%; 
            height: auto;
            border-bottom: 4px solid #fff;
        }
        .ui-panel {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
        }
        /* Mobile Controls */
        .controls-container {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            background: #444;
            user-select: none;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            border: 3px solid #888;
            touch-action: none;
        }
        .btn:active { background: #999; transform: scale(0.9); }
        .d-pad { display: flex; gap: 10px; }
        .action-pad { display: flex; gap: 10px; }
        #jumpBtn { background: #2ecc71; border-color: #27ae60; }
        #fireBtn { background: #e74c3c; border-color: #c0392b; }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div>Stage: <span id="stageNum">1</span></div>
        <div id="status">Power: Small</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-container">
        <div class="d-pad">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="action-pad">
            <div class="btn" id="fireBtn">🔥</div>
            <div class="btn" id="jumpBtn">UP</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const stageDisplay = document.getElementById('stageNum');
const statusDisplay = document.getElementById('status');

// Game State
let stage = 1;
let gameActive = true;
const gravity = 0.8;
const friction = 0.8;

const player = {
    x: 50, y: 300, width: 30, height: 30,
    velX: 0, velY: 0, speed: 5, jumpStrength: 13,
    grounded: false, type: 'small', color: "#ff2222"
};

let platforms = [], enemies = [], powerups = [], bullets = [];
let pipe = { x: 0, y: 0, w: 50, h: 60 };

// Controls State
const inputs = { left: false, right: false, up: false };

function setupTouchBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
    // Mouse support for testing on desktop
    btn.addEventListener('mousedown', () => inputs[key] = true);
    btn.addEventListener('mouseup', () => inputs[key] = false);
}

setupTouchBtn('leftBtn', 'left');
setupTouchBtn('rightBtn', 'right');
setupTouchBtn('jumpBtn', 'up');
document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(player.type === 'fire') shoot();
});
document.getElementById('fireBtn').addEventListener('mousedown', () => {
    if(player.type === 'fire') shoot();
});

function initLevel() {
    platforms = []; enemies = []; powerups = []; bullets = [];
    platforms.push({ x: 0, y: 380, w: 2500, h: 20 }); // Ground

    for (let i = 0; i < 15; i++) {
        let rx = 250 + (i * 160);
        let ry = 220 + Math.random() * 80;
        platforms.push({ x: rx, y: ry, w: 100, h: 20 });
        if (Math.random() > 0.7) {
            powerups.push({ x: rx + 40, y: ry - 30, w: 24, h: 24, type: Math.random() > 0.5 ? 'mushroom' : 'flower', collected: false });
        }
        if (i > 1 && Math.random() > 0.5) {
            enemies.push({ x: rx, y: ry - 30, w: 30, h: 30, velX: 2, dead: false, type: 'goomba' });
        }
    }

    if (stage % 3 === 0) {
        enemies.push({ x: 1800, y: 100, w: 100, h: 100, velX: 3, hp: 5, type: 'boss', dead: false });
        pipe.x = 2200;
    } else {
        pipe.x = 2000;
    }
    pipe.y = 320;
    player.x = 50; player.y = 300;
    stageDisplay.innerText = stage;
    updateStatus();
}

function updateStatus() {
    statusDisplay.innerText = "Power: " + player.type.toUpperCase();
}

function shoot() {
    bullets.push({ x: player.x + 20, y: player.y + 10, w: 12, h: 12, velX: 10 });
}

function update() {
    if (inputs.up && player.grounded) {
        player.velY = -player.jumpStrength;
        player.grounded = false;
    }
    if (inputs.right) player.velX < player.speed && player.velX++;
    if (inputs.left) player.velX > -player.speed && player.velX--;

    player.velY += gravity;
    player.x += player.velX;
    player.y += player.velY;
    player.velX *= friction;
    player.grounded = false;

    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.width > p.x &&
            player.y < p.y + p.h && player.y + player.height > p.y) {
            if (player.velY > 0) {
                player.grounded = true;
                player.velY = 0;
                player.y = p.y - player.height;
            }
        }
    });

    enemies.forEach(e => {
        if (e.dead) return;
        e.x += e.velX;
        if (e.x > 2400 || e.x < 0) e.velX *= -1;

        if (player.x < e.x + e.w && player.x + player.width > e.x &&
            player.y < e.y + e.h && player.y + player.height > e.y) {
            if (player.velY > 0 && e.type !== 'boss') {
                e.dead = true;
                player.velY = -10;
            } else {
                if(player.type !== 'small') {
                    player.type = 'small';
                    player.height = 30;
                    player.x -= 80;
                    updateStatus();
                } else {
                    alert("Game Over!");
                    stage = 1; initLevel();
                }
            }
        }
    });

    powerups.forEach(p => {
        if (!p.collected && player.x < p.x + p.w && player.x + player.width > p.x &&
            player.y < p.y + p.h && player.y + player.height > p.y) {
            p.collected = true;
            if (p.type === 'mushroom') {
                player.type = 'big';
                player.height = 45;
            } else {
                player.type = 'fire';
                player.color = "#ff8800";
            }
            updateStatus();
        }
    });

    bullets.forEach((b, i) => {
        b.x += b.velX;
        if(b.x > player.x + 800) bullets.splice(i,1);
        enemies.forEach(e => {
            if (!e.dead && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                if(e.type === 'boss') { e.hp--; if(e.hp <= 0) e.dead = true; }
                else { e.dead = true; }
                bullets.splice(i, 1);
            }
        });
    });

    if (player.x > pipe.x && player.x < pipe.x + pipe.w && player.y > pipe.y - 20) {
        stage++;
        initLevel();
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-player.x + 100, 0);

    ctx.fillStyle = "#8B4513";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(pipe.x, pipe.y, pipe.w, pipe.h);

    enemies.forEach(e => {
        if (e.dead) return;
        ctx.fillStyle = e.type === 'boss' ? "#aa0000" : "#5d4037";
        ctx.fillRect(e.x, e.y, e.w, e.h);
    });

    powerups.forEach(p => {
        if (p.collected) return;
        ctx.fillStyle = p.type === 'mushroom' ? "#ff0000" : "#ffff00";
        ctx.fillRect(p.x, p.y, p.w, p.h);
    });

    ctx.fillStyle = "orange";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.restore();
}

initLevel();
update();
</script>
</body>
</html>
