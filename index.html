<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mario Mobile Fixed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #5c94fc; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; background: #5c94fc; }
        
        /* Mobile Overlay Buttons */
        .controls { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.3); border: 3px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; pointer-events: auto; user-select: none; -webkit-user-select: none; }
        #shop-btn { background: gold; color: black; border-color: orange; font-weight: bold; }
        
        #ui { position: fixed; top: 10px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">
    <span>SCORE: <span id="score">0</span></span>
    <span>COINS: <span id="coins">0</span></span>
    <span>LVL: <span id="stage">1</span></span>
</div>

<canvas id="gameCanvas"></canvas>

<div class="controls">
    <div style="display:flex; gap: 15px;">
        <div class="btn" id="leftBtn">←</div>
        <div class="btn" id="rightBtn">→</div>
    </div>
    <div style="display:flex; gap: 15px;">
        <div class="btn" id="shop-btn">$</div>
        <div class="btn" id="jumpBtn">↑</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Resize to fit phone screen
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0, coins = 0, stage = 1;
    let player = { x: 50, y: 0, w: 30, h: 30, vx: 0, vy: 0, speed: 5, jump: -15, big: false };
    let platforms = [], enemies = [], coinsArr = [];
    let keys = { left: false, right: false, jump: false };

    function initLevel() {
        platforms = []; enemies = []; coinsArr = [];
        // Ground
        platforms.push({ x: 0, y: canvas.height - 100, w: canvas.width * 2, h: 100 });
        
        // Random Platforms
        for(let i=0; i<5; i++) {
            platforms.push({ x: 100 + (i*200), y: canvas.height - 200 - (i*50), w: 120, h: 20 });
            if(Math.random() > 0.5) {
                enemies.push({ x: 150 + (i*200), y: canvas.height - 230 - (i*50), w: 30, h: 30, dx: -2, type: stage % 5 === 0 ? 'boss' : 'koopa' });
            }
            coinsArr.push({ x: 150 + (i*200), y: canvas.height - 280 - (i*50), w: 15, h: 15 });
        }
        player.y = canvas.height - 150;
        player.vx = 0; player.vy = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Platforms
        ctx.fillStyle = '#944824';
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#00a800';
            ctx.fillRect(p.x, p.y, p.w, 10);
            ctx.fillStyle = '#944824';
        });

        // Draw Player
        ctx.fillStyle = player.big ? 'pink' : 'red';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Draw Enemies
        enemies.forEach(e => {
            ctx.fillStyle = e.type === 'boss' ? 'purple' : 'green';
            ctx.fillRect(e.x, e.y, e.w, e.h);
            e.x += e.dx;
            if(e.x < 0 || e.x > canvas.width) e.dx *= -1;
        });

        // Draw Coins
        ctx.fillStyle = 'gold';
        coinsArr.forEach(c => ctx.beginPath() || ctx.arc(c.x, c.y, 8, 0, Math.PI*2) || ctx.fill());

        updatePhysics();
        requestAnimationFrame(draw);
    }

    function updatePhysics() {
        if(keys.left) player.vx = -player.speed;
        else if(keys.right) player.vx = player.speed;
        else player.vx *= 0.8;

        player.vy += 0.8; // Gravity
        player.x += player.vx;
        player.y += player.vy;

        let onGround = false;
        platforms.forEach(p => {
            if(player.x < p.x + p.w && player.x + player.w > p.x && player.y + player.h > p.y && player.y < p.y + p.h) {
                if(player.vy > 0) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    onGround = true;
                }
            }
        });

        if(keys.jump && onGround) player.vy = player.jump;

        // Collect Coins
        coinsArr = coinsArr.filter(c => {
            let hit = player.x < c.x + 10 && player.x + player.w > c.x - 10 && player.y < c.y + 10 && player.y + player.h > c.y - 10;
            if(hit) { coins++; score += 10; document.getElementById('coins').innerText = coins; document.getElementById('score').innerText = score; }
            return !hit;
        });

        // Enemy Collision
        enemies.forEach((e, i) => {
            if(player.x < e.x + e.w && player.x + player.w > e.x && player.y + player.h > e.y && player.y < e.y + e.h) {
                if(player.vy > 0) { // Stomp
                    enemies.splice(i, 1);
                    player.vy = -10;
                    score += 50;
                    if(enemies.length === 0) { stage++; document.getElementById('stage').innerText = stage; initLevel(); }
                } else {
                    initLevel(); // Die and Restart
                }
            }
        });
    }

    // Mobile Button Logic
    function bind(id, k) {
        const b = document.getElementById(id);
        b.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
        b.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
    }
    bind('leftBtn', 'left');
    bind('rightBtn', 'right');
    bind('jumpBtn', 'jump');
    document.getElementById('shop-btn').onclick = () => {
        if(coins >= 5) { coins -= 5; player.speed += 1; document.getElementById('coins').innerText = coins; }
    };

    initLevel();
    draw();
</script>
</body>
</html>
