<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrolls of the Daedra: Tamriel Platformer</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Georgia', serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { background: #1a2a3a; display: block; width: 100%; height: 65%; border-bottom: 4px solid #333; }
        
        /* UI Overlay */
        #ui-overlay { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px 2px black; font-size: 14px; }
        
        /* Mobile Controls */
        #controls { width: 100%; height: 35%; display: flex; justify-content: space-between; align-items: center; padding: 15px; box-sizing: border-box; background: #222; }
        .btn-group { display: flex; gap: 10px; }
        .btn { 
            width: 65px; height: 65px; background: #444; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; user-select: none; border: 3px solid #666; 
            -webkit-tap-highlight-color: transparent; font-size: 12px;
        }
        .btn:active { background: #888; transform: scale(0.9); }
        .btn-special { background: #3498db; border-color: #2980b9; }
        .btn-jump { background: #e74c3c; border-color: #c0392b; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-overlay">
        <div>Hero: <span id="ui-name">Select One</span> | HP: <span id="ui-hp">0</span></div>
        <div>Artifact: <span id="ui-artifact">None</span> | Power: <span id="ui-special">Ready</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn btn-special" id="btn-ability">SKILL</div>
            <div class="btn btn-jump" id="btn-jump">JUMP</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Configuration
const GRAVITY = 0.8;
const CLASSES = {
    NORD: { name: 'Nord', hp: 5, speed: 4, jump: -14, color: '#bdc3c7', ability: 'Battle Cry' },
    ALTMER: { name: 'High Elf', hp: 2, speed: 5, jump: -18, color: '#f1c40f', ability: 'Magelight' },
    KHAJIIT: { name: 'Khajiit', hp: 3, speed: 7, jump: -14, color: '#a0522d', ability: 'Night Dash' }
};

let gameState = 'SELECT'; 
let player = {
    x: 50, y: 100, w: 30, h: 50, dx: 0, dy: 0,
    onGround: false, hp: 0, artifact: "None", stats: null,
    abilityCooldown: 0, specialActive: 0
};

// World Data
let platforms = [
    {x: 0, y: 0, w: 2500, h: 40}, // Placeholder ground, will update on resize
    {x: 200, y: 200, w: 150, h: 20},
    {x: 450, y: 120, w: 150, h: 20},
    {x: 700, y: 220, w: 200, h: 20},
    {x: 1000, y: 150, w: 300, h: 20}
];

let enemies = [
    {x: 400, y: 0, w: 40, h: 40, type: 'Forsworn', speed: 2, dir: 1, hp: 1},
    {x: 800, y: 0, w: 40, h: 40, type: 'Bandit', speed: 1.5, dir: 1, hp: 1},
    {x: 1200, y: 0, w: 50, h: 50, type: 'Dremora', speed: 3, dir: 1, hp: 2}
];

let artifacts = [
    {x: 480, y: 80, w: 25, h: 25, name: 'Wabbajack', collected: false},
    {x: 1100, y: 100, w: 25, h: 25, name: 'Mehrunes Razor', collected: false}
];

// Setup
function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.65;
    platforms[0].y = canvas.height - 40; // Ground positioning
    enemies.forEach(e => e.y = canvas.height - 80);
}
window.addEventListener('resize', init);
init();

// Controls
const keys = {};
const setupBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
    btn.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; });
};

setupBtn('btn-left', 'left');
setupBtn('btn-right', 'right');
setupBtn('btn-jump', 'jump');
setupBtn('btn-ability', 'special');

canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'SELECT') return;
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    if (y > 100 && y < 160) start('NORD');
    if (y > 180 && y < 240) start('ALTMER');
    if (y > 260 && y < 320) start('KHAJIIT');
});

function start(cls) {
    player.stats = CLASSES[cls];
    player.hp = player.stats.hp;
    document.getElementById('ui-name').innerText = player.stats.name;
    gameState = 'PLAYING';
}

function useSpecial() {
    if (player.abilityCooldown > 0) return;
    
    if (player.stats.name === 'Nord') {
        // Battle Cry: Repel nearby enemies
        enemies.forEach(e => {
            if (Math.abs(e.x - player.x) < 200) e.dir *= -1; e.x += e.dir * 50;
        });
    } else if (player.stats.name === 'High Elf') {
        // Magelight: Slow gravity for 2 seconds
        player.dy = -5;
    } else if (player.stats.name === 'Khajiit') {
        // Night Dash: Burst forward
        player.x += (player.dx * 20);
    }
    
    player.abilityCooldown = 180; // 3 seconds at 60fps
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Movement
    if (keys['left']) player.dx = -player.stats.speed;
    else if (keys['right']) player.dx = player.stats.speed;
    else player.dx = 0;

    if (keys['jump'] && player.onGround) {
        player.dy = player.stats.jump;
        player.onGround = false;
    }

    if (keys['special']) useSpecial();
    if (player.abilityCooldown > 0) player.abilityCooldown--;

    // Physics
    player.dy += GRAVITY;
    player.x += player.dx;
    player.y += player.dy;

    // Collisions
    player.onGround = false;
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.dy) {
            player.y = p.y - player.h;
            player.dy = 0;
            player.onGround = true;
        }
    });

    // Enemy & Artifact interaction
    enemies.forEach(e => {
        e.x += e.speed * e.dir;
        if (e.x > player.x + 800 || e.x < -100) e.dir *= -1;

        if (Math.abs(player.x - e.x) < 25 && Math.abs(player.y - e.y) < 30) {
            if (player.dy > 0 && !player.onGround) {
                e.x = -5000; // Defeated
                player.dy = -10;
            } else {
                player.hp -= 0.02;
            }
        }
    });

    artifacts.forEach(a => {
        if (!a.collected && Math.abs(player.x - a.x) < 30 && Math.abs(player.y - a.y) < 30) {
            a.collected = true;
            player.artifact = a.name;
            document.getElementById('ui-artifact').innerText = a.name;
        }
    });

    // UI Updates
    document.getElementById('ui-hp').innerText = Math.ceil(player.hp);
    document.getElementById('ui-special').innerText = player.abilityCooldown > 0 ? "Recharging..." : "READY";

    if (player.hp <= 0 || player.y > canvas.height) {
        alert("Wasted! Return to Sovngarde.");
        location.reload();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'SELECT') {
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "24px Georgia";
        ctx.fillText("SELECT YOUR CHAMPION", canvas.width/2, 60);
        
        let i = 0;
        for (let key in CLASSES) {
            ctx.fillStyle = CLASSES[key].color;
            ctx.fillRect(canvas.width/2 - 100, 100 + (i * 80), 200, 50);
            ctx.fillStyle = "black";
            ctx.font = "18px Arial";
            ctx.fillText(CLASSES[key].name, canvas.width/2, 132 + (i * 80));
            i++;
        }
    } else {
        // Draw Platforms (Landscape of Tamriel)
        ctx.fillStyle = '#4e342e';
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

        // Draw Artifacts
        artifacts.forEach(a => {
            if(!a.collected) {
                ctx.fillStyle = '#9b59b6';
                ctx.fillRect(a.x, a.y, a.w, a.h);
                ctx.fillStyle = "white";
                ctx.font = "10px Arial";
                ctx.fillText("Item", a.x, a.y - 5);
            }
        });

        // Draw Enemies
        enemies.forEach(e => {
            ctx.fillStyle = e.type === 'Dremora' ? '#000' : '#7f8c8d';
            ctx.fillRect(e.x, e.y, e.w, e.h);
        });

        // Draw Player
        ctx.fillStyle = player.stats.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }
    
    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
